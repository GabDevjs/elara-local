name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uma execução por ref: um push novo cancela o anterior em vez de enfileirar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Símbolos de debug dominam o cache e não são lidos em CI.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # webkit2gtk/libsoup são dependências de link do Tauri; sem elas o crate
      # do desktop nem compila.
      - name: Dependências de sistema do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: cargo test --workspace

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dos pacotes
        run: pnpm -r build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:ts

      - name: Formatação
        run: pnpm exec prettier --check .

      - name: Testes
        run: pnpm -r test

  contracts:
    name: Contratos Rust ↔ TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # As bindings TypeScript são commitadas para que o build de TS não exija a
      # toolchain Rust. Isso só é seguro se alguém verificar que continuam
      # correspondendo às structs — é o que este passo faz.
      - name: Bindings geradas estão em dia
        run: pnpm run bindings:check
